<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640"
    font-family="Georgia, 'Times New Roman', serif">
  <rect width="1040" height="640" fill="#1A1A1A"/>

  <!-- Top card: Park Street total -->
  <rect x="20" y="20" width="1000" height="320" fill="none" stroke="#8A8A82" stroke-opacity="0.2" stroke-width="1"/>
  <rect x="20" y="20" width="4" height="320" fill="#C8102E"/>
  <text x="56" y="62" font-family="'JetBrains Mono', monospace" font-size="26" fill="#8A8A82" letter-spacing="1.5">
    PARK STREET FOOTFALL  ·  LAST WEEK
  </text>

  <text x="56" y="200" font-size="120" fill="#FAF7F0" font-weight="400">2,133</text>
  <text x="56" y="246" font-size="26" fill="#8A8A82" font-style="italic">Pedestrian visits</text>

  <text x="980" y="200" font-size="70" fill="#8A8A82" text-anchor="end">↓  65%</text>
  <text x="980" y="246" font-size="26" fill="#8A8A82" font-style="italic" text-anchor="end">vs week prior</text>

  <!-- Bottom-left: Domestic -->
  <rect x="20" y="360" width="490" height="240" fill="none" stroke="#8A8A82" stroke-opacity="0.2" stroke-width="1"/>
  <rect x="20" y="360" width="4" height="240" fill="#C8102E"/>
  <text x="56" y="400" font-family="'JetBrains Mono', monospace" font-size="26" fill="#8A8A82" letter-spacing="1.5">
    DOMESTIC PEDESTRIANS
  </text>
  <text x="56" y="500" font-size="90" fill="#FAF7F0">94%</text>
  <text x="56" y="558" font-size="26" fill="#8A8A82" font-style="italic">2,013 visits</text>

  <!-- Bottom-right: International -->
  <rect x="530" y="360" width="490" height="240" fill="none" stroke="#8A8A82" stroke-opacity="0.2" stroke-width="1"/>
  <rect x="530" y="360" width="4" height="240" fill="#C8102E"/>
  <text x="566" y="400" font-family="'JetBrains Mono', monospace" font-size="26" fill="#8A8A82" letter-spacing="1.5">
    INTERNATIONAL PEDESTRIANS
  </text>
  <text x="566" y="500" font-size="90" fill="#FAF7F0">6%</text>
  <text x="566" y="558" font-size="26" fill="#8A8A82" font-style="italic">120 visits</text>

  <!-- Footer stamp -->
  <text x="520" y="625" font-family="'JetBrains Mono', monospace" font-size="16" fill="#8A8A82" letter-spacing="1.5" text-anchor="middle">
    BRISTOL BID PEDESTRIAN COUNTER  ·  W/C 2026-06-29
  </text>
</svg>