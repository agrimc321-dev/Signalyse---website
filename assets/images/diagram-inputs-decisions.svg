<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1140 420"
     style="display:block;width:100%;height:auto"
     font-family="'Source Serif 4', 'Source Serif Pro', Georgia, serif"
     role="img"
     aria-label="Signalyse reads your data and produces clear operational decisions">

  <defs>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1A1A1A" opacity="0.55"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#C8102E"/>
    </marker>
  </defs>

  <!-- ============================================================
       LEFT — INPUTS column
       ============================================================ -->
  <text x="0" y="34"
        font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="14" letter-spacing="2" fill="#8A8A82">INPUTS</text>
  <line x1="0" y1="46" x2="120" y2="46" stroke="#C8102E" stroke-width="0.5" opacity="0.7"/>

  <g stroke="#1A1A1A" stroke-width="0.9" fill="none"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- Sales (till receipt) -->
    <g transform="translate(10, 90)">
      <path d="M0,0 L18,0 L18,24 L15,21 L12,24 L9,21 L6,24 L3,21 L0,24 Z"/>
      <line x1="3" y1="6" x2="15" y2="6"/>
      <line x1="3" y1="11" x2="13" y2="11"/>
      <line x1="3" y1="16" x2="11" y2="16"/>
    </g>
    <text x="46" y="108" font-size="18" fill="#1A1A1A" stroke="none">Sales</text>

    <!-- Weather (sun + cloud) -->
    <g transform="translate(10, 150)">
      <circle cx="6" cy="8" r="5"/>
      <line x1="6" y1="0" x2="6" y2="2"/>
      <line x1="6" y1="14" x2="6" y2="16"/>
      <line x1="0" y1="8" x2="2" y2="8"/>
      <path d="M11,16 a5,5 0 0,1 9,1 a3.5,3.5 0 0,1 -2,7 L12,24 a4,4 0 0,1 -1,-8 Z" fill="#FAF7F0"/>
    </g>
    <text x="46" y="168" font-size="18" fill="#1A1A1A" stroke="none">Weather</text>

    <!-- Footfall (two figures) -->
    <g transform="translate(10, 210)">
      <circle cx="5" cy="5" r="3.5"/>
      <path d="M0,22 a5,5 0 0,1 10,0"/>
      <circle cx="16" cy="5" r="3.5"/>
      <path d="M11,22 a5,5 0 0,1 10,0"/>
    </g>
    <text x="46" y="228" font-size="18" fill="#1A1A1A" stroke="none">Footfall</text>

    <!-- Rotas (calendar grid) -->
    <g transform="translate(10, 270)">
      <rect x="0" y="2" width="22" height="20" rx="1"/>
      <line x1="0" y1="8" x2="22" y2="8"/>
      <line x1="6" y1="0" x2="6" y2="4"/>
      <line x1="16" y1="0" x2="16" y2="4"/>
      <line x1="7" y1="12" x2="11" y2="12"/>
      <line x1="14" y1="12" x2="18" y2="12"/>
      <line x1="7" y1="17" x2="11" y2="17"/>
      <line x1="14" y1="17" x2="18" y2="17"/>
    </g>
    <text x="46" y="288" font-size="18" fill="#1A1A1A" stroke="none">Rotas</text>

    <!-- Invoices (paper with lines) -->
    <g transform="translate(10, 330)">
      <path d="M0,0 L18,0 L18,24 L0,24 Z"/>
      <line x1="3" y1="6" x2="15" y2="6"/>
      <line x1="3" y1="11" x2="15" y2="11"/>
      <line x1="3" y1="16" x2="11" y2="16"/>
    </g>
    <text x="46" y="348" font-size="18" fill="#1A1A1A" stroke="none">Invoices</text>
  </g>

  <!-- ============================================================
       CONVERGING LINES — inputs into READ icon
       ============================================================ -->
  <g stroke="#1A1A1A" stroke-width="0.7" opacity="0.45" fill="none"
     marker-end="url(#arrow-grey)">
    <line x1="160" y1="102" x2="288" y2="220"/>
    <line x1="160" y1="162" x2="288" y2="220"/>
    <line x1="160" y1="222" x2="288" y2="220"/>
    <line x1="160" y1="282" x2="288" y2="220"/>
    <line x1="160" y1="342" x2="288" y2="220"/>
  </g>

  <!-- ============================================================
       PROCESS ROW — 4 icons at y=220, tagline at y=150
       ============================================================ -->
  <text x="575" y="150" text-anchor="middle"
        font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="14" letter-spacing="2" fill="#C8102E">SIGNALYSE READS &#160;·&#160; ANALYSES &#160;·&#160; WRITES</text>

  <!-- Red arrows between centre icons -->
  <g stroke="#C8102E" stroke-width="1.6" fill="none"
     stroke-linecap="round" marker-end="url(#arrow-red)">
    <line x1="354" y1="220" x2="456" y2="220"/>
    <line x1="524" y1="220" x2="626" y2="220"/>
    <line x1="694" y1="220" x2="796" y2="220"/>
  </g>

  <!-- Icon 1 — READ (magnifying glass over lines) -->
  <g transform="translate(320, 220)">
    <rect x="-28" y="-28" width="56" height="56" fill="#FAF7F0" stroke="none"/>
    <g stroke="#1A1A1A" stroke-width="1.6" fill="none"
       stroke-linecap="round" stroke-linejoin="round">
      <circle cx="-5" cy="-5" r="13" fill="#FAF7F0"/>
      <line x1="5" y1="5" x2="14" y2="14" stroke-width="2.2"/>
      <line x1="-12" y1="-9" x2="0"  y2="-9" stroke-width="1.1"/>
      <line x1="-12" y1="-4" x2="-2" y2="-4" stroke-width="1.1"/>
      <line x1="-12" y1="1"  x2="-4" y2="1"  stroke-width="1.1"/>
    </g>
  </g>
  <text x="320" y="290" text-anchor="middle"
        font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="14" letter-spacing="2" fill="#8A8A82">READ</text>

  <!-- Icon 2 — ANALYSE (scatter dots in frame) -->
  <g transform="translate(490, 220)">
    <rect x="-28" y="-28" width="56" height="56" fill="#FAF7F0" stroke="none"/>
    <rect x="-18" y="-14" width="36" height="28" fill="#FAF7F0"
          stroke="#1A1A1A" stroke-width="1.2"/>
    <g fill="#1A1A1A">
      <circle cx="-13" cy="8"  r="1.6"/>
      <circle cx="-9"  cy="-3" r="1.6"/>
      <circle cx="-5"  cy="9"  r="1.6"/>
      <circle cx="-1"  cy="0"  r="1.6"/>
      <circle cx="3"   cy="-7" r="1.6"/>
      <circle cx="7"   cy="4"  r="1.6"/>
      <circle cx="11"  cy="-2" r="1.6"/>
      <circle cx="14"  cy="6"  r="1.6"/>
    </g>
  </g>
  <text x="490" y="290" text-anchor="middle"
        font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="14" letter-spacing="2" fill="#8A8A82">ANALYSE</text>

  <!-- Icon 3 — SPOT TREND (rising red line in frame) -->
  <g transform="translate(660, 220)">
    <rect x="-28" y="-28" width="56" height="56" fill="#FAF7F0" stroke="none"/>
    <rect x="-18" y="-14" width="36" height="28" fill="#FAF7F0"
          stroke="#1A1A1A" stroke-width="1.2"/>
    <polyline points="-16,10 -10,6 -4,2 2,-3 8,-5 15,-10"
              fill="none" stroke="#C8102E" stroke-width="2.2"
              stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="15" cy="-10" r="2.4" fill="#C8102E"/>
  </g>
  <text x="660" y="290" text-anchor="middle"
        font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="14" letter-spacing="2" fill="#8A8A82">SPOT TREND</text>

  <!-- Icon 4 — REPORT (document with chart) -->
  <g transform="translate(830, 220)">
    <rect x="-28" y="-28" width="56" height="56" fill="#FAF7F0" stroke="none"/>
    <rect x="-14" y="-18" width="28" height="36" fill="#FAF7F0"
          stroke="#1A1A1A" stroke-width="1.4"/>
    <line x1="-10" y1="-13" x2="6" y2="-13" stroke="#1A1A1A" stroke-width="1"/>
    <g stroke="none" fill="#1A1A1A">
      <rect x="-10" y="-6" width="3.2" height="8"/>
      <rect x="-5"  y="-9" width="3.2" height="11"/>
      <rect x="0"   y="-4" width="3.2" height="6"/>
    </g>
    <rect x="5" y="-10" width="3.2" height="12" fill="#C8102E"/>
    <line x1="-10" y1="7"  x2="9"  y2="7"  stroke="#1A1A1A" stroke-width="0.9"/>
    <line x1="-10" y1="11" x2="4"  y2="11" stroke="#1A1A1A" stroke-width="0.9"/>
  </g>
  <text x="830" y="290" text-anchor="middle"
        font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="14" letter-spacing="2" fill="#8A8A82">REPORT</text>

  <!-- ============================================================
       DIVERGING LINES — REPORT out to decisions
       ============================================================ -->
  <g stroke="#1A1A1A" stroke-width="0.7" opacity="0.45" fill="none"
     marker-end="url(#arrow-grey)">
    <line x1="862" y1="220" x2="930" y2="102"/>
    <line x1="862" y1="220" x2="930" y2="162"/>
    <line x1="862" y1="220" x2="930" y2="222"/>
    <line x1="862" y1="220" x2="930" y2="282"/>
    <line x1="862" y1="220" x2="930" y2="342"/>
  </g>

  <!-- ============================================================
       RIGHT — DECISIONS column
       ============================================================ -->
  <text x="940" y="34"
        font-family="'JetBrains Mono', 'Courier New', monospace"
        font-size="14" letter-spacing="2" fill="#8A8A82">DECISIONS</text>
  <line x1="940" y1="46" x2="1060" y2="46" stroke="#C8102E" stroke-width="0.5" opacity="0.7"/>

  <g stroke="#1A1A1A" stroke-width="0.9" fill="none"
     stroke-linecap="round" stroke-linejoin="round">

    <!-- Staff + (people with plus) -->
    <g transform="translate(940, 90)">
      <circle cx="6" cy="5" r="3.5"/>
      <path d="M1,22 a5,5 0 0,1 10,0"/>
      <line x1="17" y1="6" x2="23" y2="6"/>
      <line x1="20" y1="3" x2="20" y2="9"/>
    </g>
    <text x="980" y="108" font-size="18" fill="#1A1A1A" stroke="none">Staff up Saturday</text>

    <!-- Tag (promo) -->
    <g transform="translate(940, 150)">
      <path d="M0,4 L12,4 L22,14 L12,24 L0,24 Z"/>
      <circle cx="4" cy="9" r="1.4" fill="#1A1A1A"/>
      <line x1="7" y1="20" x2="17" y2="10"/>
      <circle cx="8.5" cy="18.5" r="1.4" fill="#1A1A1A"/>
      <circle cx="15.5" cy="11.5" r="1.4" fill="#1A1A1A"/>
    </g>
    <text x="980" y="168" font-size="18" fill="#1A1A1A" stroke="none">Cut Tuesday promo</text>

    <!-- £ coin -->
    <g transform="translate(940, 210)">
      <circle cx="11" cy="12" r="10"/>
      <path d="M14,6 L8,6 a3,3 0 0,0 0,6 L11,12 a3,3 0 0,1 0,6 L6,18"/>
      <line x1="6" y1="13" x2="13" y2="13"/>
    </g>
    <text x="980" y="228" font-size="18" fill="#1A1A1A" stroke="none">Reprice your menu</text>

    <!-- Down arrow in box -->
    <g transform="translate(940, 270)">
      <rect x="0" y="2" width="22" height="20" rx="1"/>
      <line x1="11" y1="7" x2="11" y2="17"/>
      <polyline points="6,13 11,18 16,13"/>
    </g>
    <text x="980" y="288" font-size="18" fill="#1A1A1A" stroke="none">Order 12% less milk</text>

    <!-- Sun + clock -->
    <g transform="translate(940, 330)">
      <circle cx="6" cy="12" r="5"/>
      <line x1="6" y1="3" x2="6" y2="5"/>
      <line x1="6" y1="19" x2="6" y2="21"/>
      <line x1="0" y1="12" x2="2" y2="12"/>
      <line x1="10" y1="12" x2="12" y2="12"/>
      <circle cx="18" cy="12" r="5"/>
      <line x1="18" y1="12" x2="18" y2="9"/>
      <line x1="18" y1="12" x2="20.5" y2="13.5"/>
    </g>
    <text x="980" y="348" font-size="18" fill="#1A1A1A" stroke="none">Open garden at 4pm</text>
  </g>

</svg>
