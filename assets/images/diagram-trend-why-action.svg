<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1080 500"
     style="display:block;width:100%;height:auto"
     font-family="'Source Serif 4', 'Source Serif Pro', Georgia, serif"
     role="img"
     aria-label="Three panels reading trend, why, and action. A weekly revenue dip identified, traced to the payday cycle, and recovered with a promotion.">

  <!-- ============================================================
       PANEL 1 — TREND
       Bar chart with WK 4 in FT red and -22% callout above
       ============================================================ -->
  <g transform="translate(40, 0)">
    <text x="0" y="26"
          font-family="'JetBrains Mono', 'Courier New', monospace"
          font-size="14" letter-spacing="2" fill="#C8102E">01 &#160;·&#160; TREND</text>

    <g transform="translate(0, 70)">
      <line x1="0" y1="210" x2="300" y2="210" stroke="#1A1A1A" stroke-width="0.5" opacity="0.4"/>

      <rect x="20" y="80" width="55" height="130" fill="#1A1A1A" opacity="0.85"/>
      <text x="47" y="235" text-anchor="middle"
            font-family="'JetBrains Mono', 'Courier New', monospace"
            font-size="13" letter-spacing="1" fill="#8A8A82">WK 1</text>

      <rect x="95" y="68" width="55" height="142" fill="#1A1A1A" opacity="0.85"/>
      <text x="122" y="235" text-anchor="middle"
            font-family="'JetBrains Mono', 'Courier New', monospace"
            font-size="13" letter-spacing="1" fill="#8A8A82">WK 2</text>

      <rect x="170" y="74" width="55" height="136" fill="#1A1A1A" opacity="0.85"/>
      <text x="197" y="235" text-anchor="middle"
            font-family="'JetBrains Mono', 'Courier New', monospace"
            font-size="13" letter-spacing="1" fill="#8A8A82">WK 3</text>

      <rect x="245" y="128" width="55" height="82" fill="#C8102E"/>
      <text x="272" y="235" text-anchor="middle"
            font-family="'JetBrains Mono', 'Courier New', monospace"
            font-size="13" letter-spacing="1" fill="#C8102E">WK 4</text>

      <path d="M 272,118 L 272,98" stroke="#C8102E" stroke-width="0.9" fill="none"/>
      <polygon points="272,92 268,98 276,98" fill="#C8102E"/>
      <text x="272" y="80" text-anchor="middle"
            font-family="'JetBrains Mono', 'Courier New', monospace"
            font-size="14" letter-spacing="1" fill="#C8102E" font-weight="700">−22%</text>
    </g>

    <text x="0" y="380" font-style="italic" font-size="20" fill="#1A1A1A">Week 4 always trails.</text>
  </g>

  <!-- Connector arrow: panel 1 → panel 2 -->
  <g transform="translate(345, 200)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#1A1A1A" stroke-width="0.8" opacity="0.5"/>
    <polygon points="30,0 23,-5 23,5" fill="#1A1A1A" opacity="0.6"/>
  </g>

  <!-- ============================================================
       PANEL 2 — WHY
       Calendar with last Friday (payday) highlighted
       ============================================================ -->
  <g transform="translate(390, 0)">
    <text x="0" y="26"
          font-family="'JetBrains Mono', 'Courier New', monospace"
          font-size="14" letter-spacing="2" fill="#8A8A82">02 &#160;·&#160; WHY</text>

    <g transform="translate(35, 75)">
      <rect x="0" y="0" width="230" height="200" rx="3" fill="none"
            stroke="#1A1A1A" stroke-width="0.5" opacity="0.4"/>

      <!-- Day-of-week headers -->
      <g font-family="'JetBrains Mono', 'Courier New', monospace"
         font-size="11" letter-spacing="1" fill="#8A8A82" text-anchor="middle">
        <text x="23" y="22">M</text>
        <text x="56" y="22">T</text>
        <text x="89" y="22">W</text>
        <text x="122" y="22">T</text>
        <text x="155" y="22">F</text>
        <text x="188" y="22">S</text>
        <text x="215" y="22">S</text>
      </g>
      <line x1="10" y1="30" x2="220" y2="30" stroke="#1A1A1A" stroke-width="0.3" opacity="0.3"/>

      <!-- Date cells: 4 weeks -->
      <g font-family="'JetBrains Mono', 'Courier New', monospace" font-size="12" fill="#1A1A1A">
        <text x="23" y="58" text-anchor="middle">1</text>
        <text x="56" y="58" text-anchor="middle">2</text>
        <text x="89" y="58" text-anchor="middle">3</text>
        <text x="122" y="58" text-anchor="middle">4</text>
        <text x="155" y="58" text-anchor="middle">5</text>
        <text x="188" y="58" text-anchor="middle">6</text>
        <text x="215" y="58" text-anchor="middle">7</text>
        <text x="23" y="90" text-anchor="middle">8</text>
        <text x="56" y="90" text-anchor="middle">9</text>
        <text x="89" y="90" text-anchor="middle">10</text>
        <text x="122" y="90" text-anchor="middle">11</text>
        <text x="155" y="90" text-anchor="middle">12</text>
        <text x="188" y="90" text-anchor="middle">13</text>
        <text x="215" y="90" text-anchor="middle">14</text>
        <text x="23" y="122" text-anchor="middle">15</text>
        <text x="56" y="122" text-anchor="middle">16</text>
        <text x="89" y="122" text-anchor="middle">17</text>
        <text x="122" y="122" text-anchor="middle">18</text>
        <text x="155" y="122" text-anchor="middle">19</text>
        <text x="188" y="122" text-anchor="middle">20</text>
        <text x="215" y="122" text-anchor="middle">21</text>
        <text x="23" y="154" text-anchor="middle">22</text>
        <text x="56" y="154" text-anchor="middle">23</text>
        <text x="89" y="154" text-anchor="middle">24</text>
        <text x="122" y="154" text-anchor="middle">25</text>
        <!-- Payday highlight -->
        <circle cx="155" cy="150" r="12" fill="#C8102E"/>
        <text x="155" y="154" text-anchor="middle" fill="#FAF7F0" font-weight="700">26</text>
        <text x="188" y="154" text-anchor="middle">27</text>
        <text x="215" y="154" text-anchor="middle">28</text>
      </g>

      <text x="155" y="184" text-anchor="middle"
            font-family="'JetBrains Mono', 'Courier New', monospace"
            font-size="12" letter-spacing="1.5" fill="#C8102E" font-weight="700">PAYDAY</text>
    </g>

    <text x="0" y="380" font-style="italic" font-size="20" fill="#1A1A1A">Customers wait for payday.</text>
  </g>

  <!-- Connector arrow: panel 2 → panel 3 -->
  <g transform="translate(700, 200)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#1A1A1A" stroke-width="0.8" opacity="0.5"/>
    <polygon points="30,0 23,-5 23,5" fill="#1A1A1A" opacity="0.6"/>
  </g>

  <!-- ============================================================
       PANEL 3 — ACTION
       Same bar chart with WK 4 recovered to baseline via PROMO,
       RECOVERED callout above the bar
       ============================================================ -->
  <g transform="translate(745, 0)">
    <text x="0" y="26"
          font-family="'JetBrains Mono', 'Courier New', monospace"
          font-size="14" letter-spacing="2" fill="#8A8A82">03 &#160;·&#160; ACTION</text>

    <g transform="translate(0, 70)">
      <line x1="0" y1="210" x2="300" y2="210" stroke="#1A1A1A" stroke-width="0.5" opacity="0.4"/>

      <rect x="20" y="80" width="55" height="130" fill="#1A1A1A" opacity="0.85"/>
      <text x="47" y="235" text-anchor="middle"
            font-family="'JetBrains Mono', 'Courier New', monospace"
            font-size="13" letter-spacing="1" fill="#8A8A82">WK 1</text>

      <rect x="95" y="68" width="55" height="142" fill="#1A1A1A" opacity="0.85"/>
      <text x="122" y="235" text-anchor="middle"
            font-family="'JetBrains Mono', 'Courier New', monospace"
            font-size="13" letter-spacing="1" fill="#8A8A82">WK 2</text>

      <rect x="170" y="74" width="55" height="136" fill="#1A1A1A" opacity="0.85"/>
      <text x="197" y="235" text-anchor="middle"
            font-family="'JetBrains Mono', 'Courier New', monospace"
            font-size="13" letter-spacing="1" fill="#8A8A82">WK 3</text>

      <!-- Dashed outline at the original (dipped) height for reference -->
      <rect x="245" y="128" width="55" height="82" fill="none"
            stroke="#8A8A82" stroke-width="0.5" stroke-dasharray="2 2"/>
      <!-- Lifted (recovered) bar -->
      <rect x="245" y="90" width="55" height="120" fill="#1A1A1A" opacity="0.85"/>
      <!-- PROMO tag inside the lifted portion -->
      <g transform="translate(247, 95)">
        <rect x="0" y="0" width="51" height="18" fill="#C8102E"/>
        <text x="25.5" y="13" text-anchor="middle"
              font-family="'JetBrains Mono', 'Courier New', monospace"
              font-size="11" letter-spacing="1" fill="#FAF7F0" font-weight="700">PROMO</text>
      </g>
      <text x="272" y="235" text-anchor="middle"
            font-family="'JetBrains Mono', 'Courier New', monospace"
            font-size="13" letter-spacing="1" fill="#8A8A82">WK 4</text>

      <!-- RECOVERED callout above the bar (symmetric with -22% in panel 1) -->
      <path d="M 272,80 L 272,60" stroke="#C8102E" stroke-width="0.9" fill="none"/>
      <polygon points="272,54 268,60 276,60" fill="#C8102E"/>
      <text x="272" y="42" text-anchor="middle"
            font-family="'JetBrains Mono', 'Courier New', monospace"
            font-size="14" letter-spacing="1" fill="#C8102E" font-weight="700">RECOVERED</text>
    </g>

    <text x="0" y="380" font-style="italic" font-size="20" fill="#1A1A1A">Run a promotion.</text>
    <text x="0" y="408" font-style="italic" font-size="20" fill="#1A1A1A">Win the week back.</text>
  </g>

</svg>
